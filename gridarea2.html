<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0;}
        .container{
            display:grid;
            grid-template-columns: 200px ;
            grid-template-rows:200px 200px 200px;
            grid-template-areas:
         "Logo Heading Heading"
         "Paragraph Paragraph Image"
         "Footer Footer Footer";
        }
        .one{
        background-color: aqua;
        grid-area:Logo;
    }
    .two{
        background-color:burlywood;
        grid-area:Heading;
    }
    .three{
        background-color:chocolate;
        grid-area: Paragraph;
    }
    .four{
        background-color:darkcyan;
        grid-area:Image ;
    }
    .five{
        background-color:darkgreen;
        grid-area:Footer ;
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="one">Logo</div>
        <div class="two">Heading</div>
        <div class="three">Paragraph</div>
        <div class="four">Image</div>
        <div class="five">Footer</div>
        </div>
    
</body>
</html>
