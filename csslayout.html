<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-align:center;
        }
        .box1{
            height: 100px;
            width:200px;
            background-color: lightblue;
            border:2px solid black;
            position:fixed;
            top:50px;
            left:50px;
            z-index: 1;
        }
        .box2{
            height: 100px;
            width:200px;
            background-color: rgb(207, 135, 63);
            border:2px solid black;
            position:fixed;
            top:100px;
            left:100px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>this is heading</h1>
    <div class="box1">box 1</div>
    <div class="box2">box 2</div>
    </div>
</body>
</html>
