<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
    display: flex;
    flex-wrap: wrap;   
    gap: 20px;
}

.box{
    background: lightblue;
    padding: 40px;
    text-align: center;
    font-size: 20px;

    flex: 1 1 23%; 
    }  
@media (max-width: 992px){
    .box{
        flex: 1 1 48%;
    }
}
@media (max-width: 576px){
    .box{
        flex: 1 1 100%;
    }
}
    </style>
   
        
</head>
<body>
    <div class="container">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
    <div class="box">4</div>
</div>
     </body>
</head>
