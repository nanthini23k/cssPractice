<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{margin:0;}
        .container{
            display:grid;
            grid-template-columns:800px;
            grid-template-rows: 100px 300px 200px;
            grid-template-areas: 
            "Heading Heading"
            "Paragraph Paragraph"
            "Image Image2";
        }
        .one{
            background-color: aquamarine;
            grid-area:Heading;
        }
        .two{
            background-color: blueviolet;
            grid-area:Paragraph;
        }
        .three{
            background-color: bisque;
            grid-area:Image;
        }
        .four{
            background-color: rgb(159, 107, 44);
            grid-area:Image2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="one">Heading</div>
        <div class="two">Paragraph</div>
        <div class="three">Image</div>
        <div class="four">Image2</div>

    </div>
    
    
</body>
</html>
