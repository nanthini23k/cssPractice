<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width:50%;
            /* height:500px; */
            background-color: yellow;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 10px;
        }
        .child{
            height: 200px;
            background-color: lightblue;
            border-radius: 10px;
            border: 2px solid black;
            text-align: center; 
             display: flex;
             justify-content: center;
             align-items: center;  
        }
        /* .one{
            grid-area: 2/3/3/4;
        }
        .six{
            grid-area: 1/1/2/2;
        } */
    </style>

</head>
<body>
    <div class="parent">
        <div class="child one">1</div>
        <div class="child two">2</div>
        <div class="child three">3</div>
        <div class="child four">4</div>
        <div class="child five">5</div>
        <div class="child six">6</div>
        <div class="child seven">7</div>
        <div class="child eight">8</div>
        <div class="child nine">9</div>
    <div>
</body>
</html>
